<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Facility Watch — Overview</title>
<link rel="stylesheet" href="style.css" />
</head>
<body data-page="dashboard">
  <div id="nav-mount"></div>

  <main class="page">
    <div class="page-header">
      <div>
        <h2>Overview</h2>
        <p class="page-sub">Live snapshot across all monitored facilities.</p>
      </div>
    </div>

    <section class="metrics">
      <div class="metric">
        <span class="metric-value" id="m-total">&mdash;</span>
        <span class="metric-label">Events logged</span>
      </div>
      <div class="metric metric--fault">
        <span class="metric-value" id="m-fault">&mdash;</span>
        <span class="metric-label">Verified faults</span>
      </div>
      <div class="metric metric--susp">
        <span class="metric-value" id="m-susp">&mdash;</span>
        <span class="metric-label">Suspicious, watching</span>
      </div>
      <div class="metric">
        <span class="metric-value" id="m-mtta">&mdash;</span>
        <span class="metric-label">Avg. response time</span>
      </div>
    </section>

    <div class="board" style="margin-top: 28px;">
      <section class="column">
        <h2>Active alerts <span class="count" id="active-count">0</span></h2>
        <p class="hint">Showing up to 3 most recent. <a href="alerts.html">See all active alerts &rarr;</a></p>
        <div id="active-preview" class="alert-list"></div>
      </section>

      <section class="column">
        <h2>Recently registered nodes</h2>
        <p class="hint"><a href="nodes.html">See all nodes &rarr;</a></p>
        <div id="node-preview" class="alert-list alert-list--compact"></div>
      </section>
    </div>
  </main>

  <template id="alert-card-template">
    <article class="card">
      <div class="card-top">
        <span class="badge"></span>
        <span class="card-node"></span>
      </div>
      <p class="card-location"></p>
      <p class="card-detail"></p>
      <div class="card-meta">
        <span class="card-time"></span>
        <span class="card-score"></span>
      </div>
    </article>
  </template>

  <script src="shared/api.js"></script>
  <script src="shared/nav.js"></script>
  <script src="index.js"></script>
</body>
</html>
